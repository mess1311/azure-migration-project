# Nginx reverse proxy for the UbuntuWAF VM.
# Because the VM keeps its on-premises IP in Azure, the upstream below normally
# needs no change after migration. Replace with your real SmartHotelWeb1 IP.

upstream smarthotel_web {
    server 192.168.0.4:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Basic hardening (this is a plain reverse proxy, not a full WAF)
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://smarthotel_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
